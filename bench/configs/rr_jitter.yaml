Proxy:
  ProxyPort: ":8080"
  NumWorkers: 3000
  MaxConcReq: 20000
  DistAlgo: ROUND_ROBIN

Servers:
  Backend:
    Routing:
      # Same as least_conn_jitter but uses ROUND_ROBIN, so half the
      # requests hit the slow backend. P99 should be much worse.
      Prefix: /
      ProxyPass:
        - http://127.0.0.1:8001
        - http://127.0.0.1:8002

